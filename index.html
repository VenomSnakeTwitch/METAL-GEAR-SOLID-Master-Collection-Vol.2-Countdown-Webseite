<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>MGS Master Collection Vol.2</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            background: #000 url("background.jpg") no-repeat center center fixed;
            background-size: cover;
            color: gold;
        }

        #backgroundOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 0;
        }

        #mainMenu {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 1001;
            box-sizing: border-box;
        }

        #menuButtons {
            display: flex;
            gap: 10px;
        }

        #menuButtons button, #fullscreenBtn {
            font-size: 14px;
            padding: 8px 16px;
            background: black;
            border: 2px solid gold;
            color: gold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        #menuButtons button:hover, #fullscreenBtn:hover {
            background: gold;
            color: black;
        }

        #overlay {
            margin-top: 100px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 32px;
            text-shadow: 0 0 15px gold, 0 0 30px black;
            margin-bottom: 30px;
        }

        #countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid gold;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            min-width: 110px;
        }

        .number {
            font-size: 42px;
            letter-spacing: 2px;
            transition: opacity 0.2s ease;
        }

        .label {
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .blink {
            opacity: 0.3;
        }

        .music-controls {
            margin-top: 20px;
        }

        .music-controls button {
            background: black;
            border: 2px solid gold;
            color: gold;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 150px;
            height: 8px;
            background: #222;
            border: 1px solid gold;
            border-radius: 5px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: gold;
            border-radius: 50%;
            cursor: pointer;
        }

        #footer {
            position: fixed;
            bottom: 10px;
            left: 15px;
            color: gold;
            font-size: 12px;
            z-index: 1002;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div id="backgroundOverlay"></div>

<div id="mainMenu">
    <div id="menuButtons">
        <button onclick="window.location.href='mgs4quiz.html'">▶ MGS4 Quiz</button>
        <button onclick="window.location.href='trailer.html'">▶ Trailer</button>
        <button onclick="window.location.href='Music.html'">▶ Music</button>
    </div>
    <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Vollbild</button>
</div>

<div id="overlay">
    <h1>METAL GEAR SOLID Master Collection Vol. 2</h1>

    <div id="countdown">
        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">Tage</div>
        </div>
        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">Stunden</div>
        </div>
        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">Minuten</div>
        </div>
        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">Sekunden</div>
        </div>
    </div>

    <div class="music-controls">
        <button onclick="playAudio()">▶ Play</button>
        <button onclick="pauseAudio()">⏸ Pause</button>
        <input type="range" min="0" max="1" step="0.01" value="0.3" oninput="setVolume(this.value)" class="volume-slider">
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

<div id="footer">
    © 2026 VenomSnake_Twitch. Alle Rechte vorbehalten.
</div>

<script>
    // ZIELZEIT: 27. August 2026, 14:00 UTC (entspricht 16:00 Uhr deutscher Sommerzeit)
    const targetDate = new Date(Date.UTC(2026, 7, 27, 14, 0, 0)).getTime();

    function updateUnit(id, value) {
        const el = document.getElementById(id);
        if (el.textContent !== value) {
            el.classList.add("blink");
            setTimeout(() => {
                el.textContent = value;
                el.classList.remove("blink");
            }, 150);
        }
    }

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            document.getElementById("countdown").innerHTML = "<h2>MISSION COMPLETE - OUT NOW!</h2>";
            return;
        }

        const d = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
        const h = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
        const m = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
        const s = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');

        updateUnit("days", d);
        updateUnit("hours", h);
        updateUnit("minutes", m);
        updateUnit("seconds", s);
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    const audio = document.getElementById("bgMusic");
    audio.volume = 0.3;

    // Startet Musik beim ersten Klick auf die Seite (Browser-Vorgabe)
    document.addEventListener("click", () => {
        if (audio.paused) audio.play().catch(() => {});
    }, { once: true });

    function playAudio() { audio.play(); }
    function pauseAudio() { audio.pause(); }
    function setVolume(value) { audio.volume = value; }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }
</script>

</body>
</html>
