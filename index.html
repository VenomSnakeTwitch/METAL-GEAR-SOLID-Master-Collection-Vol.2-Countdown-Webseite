<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>MGS Master Collection Vol.2</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            background: #000 url("background.jpg") no-repeat center center fixed;
            background-size: cover;
            color: gold;
        }

        #backgroundOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 0;
        }

        #mainMenu {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 1001;
            box-sizing: border-box;
        }

        #menuButtons {
            display: flex;
            gap: 10px;
        }

        #menuButtons button, #fullscreenBtn {
            font-size: 14px;
            padding: 8px 16px;
            background: black;
            border: 2px solid gold;
            color: gold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        #menuButtons button:hover, #fullscreenBtn:hover {
            background: gold;
            color: black;
        }

        #overlay {
            margin-top: 100px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 32px;
            text-shadow: 0 0 15px gold, 0 0 30px black;
            margin-bottom: 30px;
        }

        #countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        #weeksDisplay {
            margin-bottom: 30px;
            font-size: 18px;
            color: white;
            text-shadow: 0 0 5px gold;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid gold;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            min-width: 110px;
        }

        .number {
            font-size: 42px;
            letter-spacing: 2px;
            transition: opacity 0.2s ease;
        }

        .label {
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .blink {
            opacity: 0.3;
        }

        .music-controls {
            margin-top: 20px;
        }

        .music-controls button {
            background: black;
            border: 2px solid gold;
            color: gold;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }

        .music-controls button:hover {
            background: gold;
            color: black;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 150px;
            height: 8px;
            background: #222;
            border: 1px solid gold;
            border-radius: 5px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: gold;
            border-radius: 50%;
            cursor: pointer;
        }

        #footer {
            position: fixed;
            bottom: 10px;
            left: 15px;
            color: gold;
            font-size: 12px;
            z-index: 1002;
            opacity: 0.8;
        }

        /* Ottercon/Otacon Styles */
        #otterContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            text-align: center;
        }
        #otterImg {
            width: 100px;
        }
        #speechBubble {
            background: white;
            color: black;
            padding: 10px;
            border-radius: 10px;
            position: absolute;
            bottom: 226px;
            right: 0;
            width: 150px;
            font-size: 12px;
            font-family: sans-serif;
            display: none;
            border: 2px solid gold;
            pointer-events: none;
        }

        @media (max-width: 900px) {
            h1 { font-size: 24px; }
            .time-box { min-width: 90px; padding: 12px 14px; }
            .number { font-size: 32px; }
            .label { font-size: 10px; }
        }
    </style>
</head>

<body>

<div id="backgroundOverlay"></div>

<div id="mainMenu">
    <div id="menuButtons">
        <button onclick="window.location.href='mgs4quiz.html'">▶ MGS4 Quiz</button>
        <button onclick="window.location.href='trailer.html'">▶ Trailer</button>
        <button onclick="window.location.href='Music.html'">▶ Music</button>
    </div>
    <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Vollbild</button>
</div>

<div id="overlay">
    <h1>METAL GEAR SOLID Master Collection Vol. 2</h1>

    <div id="countdown">
        <div class="time-box">
            <div class="number" id="years">00</div>
            <div class="label">Jahre</div>
        </div>
        <div class="time-box">
            <div class="number" id="months">00</div>
            <div class="label">Monate</div>
        </div>
        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">Tage</div>
        </div>
        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">Stunden</div>
        </div>
        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">Minuten</div>
        </div>
        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">Sekunden</div>
        </div>
    </div>

    <div id="weeksDisplay">Ungefähre Zeit bis zur Freischaltung: 0 Wochen</div>

    <div class="music-controls">
        <button onclick="playAudio()">▶ Play</button>
        <button onclick="pauseAudio()">⏸ Pause</button>
        <input type="range" min="0" max="1" step="0.01" value="0.3" oninput="setVolume(this.value)" class="volume-slider">
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

<!-- Ottercon/Otacon Bereich -->
<div id="otterContainer">
    <div id="speechBubble"></div>
    <img src="otacon.gif" id="otterImg" alt="Otacon">
</div>

<div id="footer">
    © 2026 VenomSnake_Twitch. Alle Rechte vorbehalten.
</div>

<script>
    const targetDate = new Date(Date.UTC(2026, 7, 27, 14, 0, 0)).getTime();

    function updateUnit(id, value) {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.textContent !== value) {
            el.classList.add("blink");
            setTimeout(() => {
                el.textContent = value;
                el.classList.remove("blink");
            }, 150);
        }
    }

    function updateCountdown() {
        const now = new Date();
        const target = new Date(targetDate);
        const distance = target.getTime() - now.getTime();

        if (distance < 0) {
            document.getElementById("overlay").innerHTML = "<h1>MISSION COMPLETE - OUT NOW!</h1>";
            return;
        }

        const weeks = Math.floor(distance / (1000 * 60 * 60 * 24 * 7));
        document.getElementById("weeksDisplay").textContent = "Ungefähre Zeit bis zur Freischaltung: " + weeks + " Wochen";

        let years = target.getUTCFullYear() - now.getUTCFullYear();
        let months = target.getUTCMonth() - now.getUTCMonth();
        let days = target.getUTCDate() - now.getUTCDate();
        let hours = target.getUTCHours() - now.getUTCHours();
        let minutes = target.getUTCMinutes() - now.getUTCMinutes();
        let seconds = target.getUTCSeconds() - now.getUTCSeconds();

        if (seconds < 0) { seconds += 60; minutes--; }
        if (minutes < 0) { minutes += 60; hours--; }
        if (hours < 0) { hours += 24; days--; }
        if (days < 0) { 
            const prev = new Date(target.getUTCFullYear(), target.getUTCMonth(), 0).getUTCDate();
            days += prev; months--; 
        }
        if (months < 0) { months += 12; years--; }

        updateUnit("years", String(years).padStart(2, '0'));
        updateUnit("months", String(months).padStart(2, '0'));
        updateUnit("days", String(days).padStart(2, '0'));
        updateUnit("hours", String(hours).padStart(2, '0'));
        updateUnit("minutes", String(minutes).padStart(2, '0'));
        updateUnit("seconds", String(seconds).padStart(2, '0'));
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Otacon Sprechblasen-Logik mit 25 Sprüchen
    const sayings = [
        "Kept you waiting, huh?", 
        "Otacon hier, alles klar!", 
        "Snake, du schaffst das!", 
        "Metal Gear?!", 
        "Nur noch ein bisschen Geduld!",
        "Wir müssen das stoppen!",
        "Ich hab das System gehackt!",
        "Das ist eine Falle, Snake!",
        "Ich kann das nicht glauben...",
        "Hast du die Daten?",
        "Pass auf dich auf!",
        "Das wird legendär!",
        "Ottercon im Einsatz!",
        "Die Zeit rennt uns davon!",
        "Was ist das für ein Gerät?",
        "Ich unterstütze dich von hier!",
        "Snake, hörst du mich?",
        "Mission Update incoming!",
        "Wir sind fast da!",
        "Nicht aufgeben!",
        "Versteck dich im Karton!",
        "Das ist meine Spezialität!",
        "Einfach unglaublich...",
        "Wir schaffen das zusammen!",
        "Tactical Espionage Action!"
    ];

    const bubble = document.getElementById("speechBubble");
    const img = document.getElementById("otterImg");
    
    // Sprechblase zufällig anzeigen
    setInterval(() => {
        const randomSaying = sayings[Math.floor(Math.random() * sayings.length)];
        bubble.textContent = randomSaying;
        bubble.style.display = "block";
        setTimeout(() => { bubble.style.display = "none"; }, 3000);
    }, 8000);

    // GIF-Loop erzwingen
    setInterval(() => {
        img.src = "otacon.gif?t=" + new Date().getTime();
    }, 60000); 

    const audio = document.getElementById("bgMusic");
    audio.volume = 0.3;
    document.addEventListener("click", () => { if (audio.paused) audio.play().catch(() => {}); }, { once: true });
    function playAudio() { audio.play(); }
    function pauseAudio() { audio.pause(); }
    function setVolume(value) { audio.volume = value; }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); }
</script>

</body>
</html>
