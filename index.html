<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>MGS Master Collection Vol.2</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            background: #000 url("background.jpg") no-repeat center center fixed;
            background-size: cover;
            color: gold;
        }

        #backgroundOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 0;
        }

        #mainMenu {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 1001;
            box-sizing: border-box;
        }

        #menuButtons {
            display: flex;
            gap: 10px;
        }

        #menuButtons button, #fullscreenBtn {
            font-size: 14px;
            padding: 8px 16px;
            background: black;
            border: 2px solid gold;
            color: gold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        #menuButtons button:hover, #fullscreenBtn:hover {
            background: gold;
            color: black;
        }

        #overlay {
            margin-top: 100px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 32px;
            text-shadow: 0 0 15px gold, 0 0 30px black;
            margin-bottom: 30px;
        }

        #countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid gold;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            min-width: 110px;
        }

        .number {
            font-size: 42px;
            letter-spacing: 2px;
            transition: opacity 0.2s ease;
        }

        .label {
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .blink {
            opacity: 0.3;
        }

        .music-controls {
            margin-top: 20px;
        }

        .music-controls button {
            background: black;
            border: 2px solid gold;
            color: gold;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }

        .music-controls button:hover {
            background: gold;
            color: black;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 150px;
            height: 8px;
            background: #222;
            border: 1px solid gold;
            border-radius: 5px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: gold;
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: gold;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        #footer {
            position: fixed;
            bottom: 10px;
            left: 15px;
            color: gold;
            font-size: 12px;
            z-index: 1002;
            opacity: 0.8;
        }

        @media (max-width: 900px) {
            h1 {
                font-size: 24px;
            }

            .time-box {
                min-width: 90px;
                padding: 12px 14px;
            }

            .number {
                font-size: 32px;
            }

            .label {
                font-size: 10px;
            }
        }

        @media (max-width: 600px) {
            #mainMenu {
                flex-direction: column;
                gap: 10px;
            }

            #menuButtons {
                flex-wrap: wrap;
                justify-content: center;
            }

            #overlay {
                margin-top: 150px;
            }
        }
    </style>
</head>

<body>

<div id="backgroundOverlay"></div>

<div id="mainMenu">
    <div id="menuButtons">
        <button onclick="window.location.href='mgs4quiz.html'">▶ MGS4 Quiz</button>
        <button onclick="window.location.href='trailer.html'">▶ Trailer</button>
        <button onclick="window.location.href='Music.html'">▶ Music</button>
    </div>
    <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Vollbild</button>
</div>

<div id="overlay">
    <h1>METAL GEAR SOLID Master Collection Vol. 2</h1>

    <div id="countdown">
        <div class="time-box">
            <div class="number" id="years">00</div>
            <div class="label">Jahre</div>
        </div>
        <div class="time-box">
            <div class="number" id="months">00</div>
            <div class="label">Monate</div>
        </div>
        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">Tage</div>
        </div>
        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">Stunden</div>
        </div>
        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">Minuten</div>
        </div>
        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">Sekunden</div>
        </div>
    </div>

    <div class="music-controls">
        <button onclick="playAudio()">▶ Play</button>
        <button onclick="pauseAudio()">⏸ Pause</button>
        <input type="range" min="0" max="1" step="0.01" value="0.3" oninput="setVolume(this.value)" class="volume-slider">
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

<div id="footer">
    © 2026 VenomSnake_Twitch. Alle Rechte vorbehalten.
</div>

<script>
    // ZIELZEIT: 27. August 2026, 14:00 UTC
    // Das entspricht 16:00 Uhr deutscher Sommerzeit.
    const targetDate = new Date(Date.UTC(2026, 7, 27, 14, 0, 0)).getTime();

    function updateUnit(id, value) {
        const el = document.getElementById(id);

        if (!el) return;

        if (el.textContent !== value) {
            el.classList.add("blink");

            setTimeout(() => {
                el.textContent = value;
                el.classList.remove("blink");
            }, 150);
        }
    }

    function getLastDayOfMonthUTC(year, month) {
        return new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
    }

    function updateCountdown() {
        const now = new Date();
        const target = new Date(targetDate);
        const distance = target.getTime() - now.getTime();

        if (distance < 0) {
            document.getElementById("countdown").innerHTML = "<h2>MISSION COMPLETE - OUT NOW!</h2>";
            return;
        }

        let years = target.getUTCFullYear() - now.getUTCFullYear();
        let months = target.getUTCMonth() - now.getUTCMonth();
        let days = target.getUTCDate() - now.getUTCDate();
        let hours = target.getUTCHours() - now.getUTCHours();
        let minutes = target.getUTCMinutes() - now.getUTCMinutes();
        let seconds = target.getUTCSeconds() - now.getUTCSeconds();

        if (seconds < 0) {
            seconds += 60;
            minutes--;
        }

        if (minutes < 0) {
            minutes += 60;
            hours--;
        }

        if (hours < 0) {
            hours += 24;
            days--;
        }

        if (days < 0) {
            const previousMonth = target.getUTCMonth() - 1 < 0 ? 11 : target.getUTCMonth() - 1;
            const previousMonthYear = previousMonth === 11 ? target.getUTCFullYear() - 1 : target.getUTCFullYear();
            const daysInPreviousMonth = getLastDayOfMonthUTC(previousMonthYear, previousMonth);

            days += daysInPreviousMonth;
            months--;
        }

        if (months < 0) {
            months += 12;
            years--;
        }

        updateUnit("years", String(years).padStart(2, '0'));
        updateUnit("months", String(months).padStart(2, '0'));
        updateUnit("days", String(days).padStart(2, '0'));
        updateUnit("hours", String(hours).padStart(2, '0'));
        updateUnit("minutes", String(minutes).padStart(2, '0'));
        updateUnit("seconds", String(seconds).padStart(2, '0'));
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    const audio = document.getElementById("bgMusic");
    audio.volume = 0.3;

    // Startet Musik beim ersten Klick auf die Seite. Das ist wegen Browser-Vorgaben nötig.
    document.addEventListener("click", () => {
        if (audio.paused) audio.play().catch(() => {});
    }, { once: true });

    function playAudio() {
        audio.play();
    }

    function pauseAudio() {
        audio.pause();
    }

    function setVolume(value) {
        audio.volume = value;
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }
</script>

</body>
</html>
